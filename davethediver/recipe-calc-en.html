    const recipeGrid = document.getElementById("recipeGrid");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const partyButtons = document.querySelectorAll(".party-btn");

    function render() {
      let filtered = RECIPES.filter(r => {
        const matchesParty = currentParty === "ALL" || r.category === currentParty || (r.unlock && r.unlock.includes(currentParty));
        const matchesSearch = r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.unlock.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.ingredients.some(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()) || i.loc.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesParty && matchesSearch;
      });

      filtered.sort((a, b) => {
        if (currentSort === "maxGold") return b.maxGold - a.maxGold;
        if (currentSort === "totalRevenue") return (b.maxGold * b.servings) - (a.maxGold * a.servings);
        if (currentSort === "servings") return b.servings - a.servings;
        if (currentSort === "name") return a.name.localeCompare(b.name, "en");
        return 0;
      });

      if (filtered.length === 0) {
        recipeGrid.innerHTML = `<div class="empty-state">No matching dishes found.</div>`;
        return;
      }

      recipeGrid.innerHTML = filtered.map(r => {
        const totalYield = r.maxGold * r.servings;

        return `
          <div class="recipe-card">
            <div>
              <div class="card-top">
                <div class="recipe-name">${r.name}</div>
                <span class="party-tag">${r.category}</span>
              </div>
              <div class="unlock-condition">Unlock: <span>${r.unlock}</span></div>

              <div class="stat-row">
                <div class="stat-box">
                  <div class="stat-title">Lv.10 Price</div>
                  <div class="stat-value gold">${r.maxGold.toLocaleString()} G</div>
                </div>
                <div class="stat-box">
                  <div class="stat-title">Servings</div>
                  <div class="stat-value servings">🍽️ ${r.servings} plates</div>
                </div>
              </div>

              <div class="total-yield-banner">
                <span class="total-yield-title">Batch Total Revenue:</span>
                <span class="total-yield-val">${totalYield.toLocaleString()} G</span>
              </div>
            </div>

            <div class="ingredients-box">
              <div class="ing-title">Required Ingredients (Per Batch):</div>
              <ul class="ing-list">
                ${r.ingredients.map(ing => `
                  <li class="ing-item">
                    <div class="ing-name-wrap">
                      <span>${ing.name}</span>
                      <span class="ing-loc">${ing.loc}</span>
                    </div>
                    <span class="ing-count">${ing.count}x</span>
                  </li>
                `).join("")}
              </ul>
            </div>
          </div>
        `;
      }).join("");
    }

    partyButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        partyButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentParty = btn.getAttribute("data-party");
        render();
      });
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
      render();
    });

    sortSelect.addEventListener("change", (e) => {
      currentSort = e.target.value;
      render();
    });

    render();
  </script>
</body>
