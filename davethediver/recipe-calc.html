<script>
  (function() {
    const AD_DIRECT_LINK = 'https://nwithplentyoff.org?w2Zty=1586117';
    const UNLOCK_KEY = 'emag_blog_ad_unlocked';
    const lockOverlay = document.getElementById('global-ad-lock');

    // 1. 이미 해금한 사용자인지 확인 (sessionStorage 기준: 브라우저 탭 유지 동안 유효)

    window.executeAdUnlock = function() {
      try {
        const adWin = window.open(AD_DIRECT_LINK, '_blank');
        if (adWin) {
          adWin.blur();
          window.focus();
        }
      } catch (e) {
        console.warn('Ad link triggered:', e);
      }

      // 세션 해금 플래그 저장 및 모달 제거
      sessionStorage.setItem(UNLOCK_KEY, 'true');
      lockOverlay.style.display = 'none';
    };
  })();

    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const partyButtons = document.querySelectorAll(".party-btn");

    function render() {
      let filtered = RECIPES.filter(r => {
        const matchesParty = currentParty === "ALL" || r.category === currentParty || (r.unlock && r.unlock.includes(currentParty));
        const matchesSearch = r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.unlock.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.ingredients.some(i => i.name.toLowerCase().includes(searchQuery.toLowerCase()) || i.loc.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchesParty && matchesSearch;
      });

      filtered.sort((a, b) => {
        if (currentSort === "maxGold") return b.maxGold - a.maxGold;
        if (currentSort === "totalRevenue") return (b.maxGold * b.servings) - (a.maxGold * a.servings);
        if (currentSort === "servings") return b.servings - a.servings;
        if (currentSort === "name") return a.name.localeCompare(b.name, "ko");
        return 0;
      });

      if (filtered.length === 0) {
        recipeGrid.innerHTML = `<div class="empty-state">조건에 해당하는 요리를 찾을 수 없습니다.</div>`;
        return;
      }

      recipeGrid.innerHTML = filtered.map(r => {
        const totalYield = r.maxGold * r.servings;

        return `
          <div class="recipe-card">
            <div>
              <div class="card-top">
                <div class="recipe-name">${r.name}</div>
                <span class="party-tag">${r.category}</span>
              </div>
              <div class="unlock-condition">조건: <span>${r.unlock}</span></div>

              <div class="stat-row">
                <div class="stat-box">
                  <div class="stat-title">10Lv 판매가</div>
                  <div class="stat-value gold">${r.maxGold.toLocaleString()} 원</div>
                </div>
                <div class="stat-box">
                  <div class="stat-title">서빙 접시수</div>
                  <div class="stat-value servings">🍽️ ${r.servings}그릇</div>
                </div>
              </div>

              <div class="total-yield-banner">
                <span class="total-yield-title">1회 조리 총 매출:</span>
                <span class="total-yield-val">${totalYield.toLocaleString()} 원</span>
              </div>
            </div>

            <div class="ingredients-box">
              <div class="ing-title">1회 조리 소모 재료:</div>
              <ul class="ing-list">
                ${r.ingredients.map(ing => `
                  <li class="ing-item">
                    <div class="ing-name-wrap">
                      <span>${ing.name}</span>
                      <span class="ing-loc">${ing.loc}</span>
                    </div>
                    <span class="ing-count">${ing.count}개</span>
                  </li>
                `).join("")}
              </ul>
            </div>
          </div>
        `;
      }).join("");
    }

    partyButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        partyButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentParty = btn.getAttribute("data-party");
        render();
      });
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value.trim();
